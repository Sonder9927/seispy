[project]
name = "seispy"
version = "0.1.0"
description = "SeisPy: seismic data processing."
readme = "README.md"
authors = [{ name = "Sonder Merak", email = "merak19981999@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "marimo>=0.24.0",
  "matplotlib>=3.10",
  "netcdf4>=1.7.4",
  "numpy>=2.0,<2.5",
  "obspy>=1.5.1,<1.6",
  "pandas>=3.0.5",
  "pygmt>=0.19.0",
  "scipy>=1.14,<1.19",
  "tqdm>=4.70.0",
]

[project.scripts]
seispy = "seispy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pylint>=4.0.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.6",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=1.0.6",
]
pdf = [
  "mkdocs-print-site-plugin>=2.8",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
markers = [
  "integration: tests that require files or external programs",
  "slow: slow-running tests",
]

[tool.coverage.run]
branch = true
source = ["src/seispy"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82", "B", "SIM", "PERF"]

[tool.pylint.main]
disable = ["all"]
enable = ["duplicate-code"]
persistent = false

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
min-similarity-lines = 20

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
