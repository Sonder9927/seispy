site_name: SeisPy
site_description: Seismic data processing workflows built on ObsPy
site_url: https://sonder9927.github.io/seispy/
site_dir: site
use_directory_urls: false
repo_url: https://github.com/Sonder9927/seispy
repo_name: Sonder9927/seispy
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Sonder Merak

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Start here:
      - Quick start: quickstart.md
      - Choose a task: task-guide.md
  - Recipes:
      - Overview: recipes/index.md
      - Batch reports and logs: recipes/batch-reports.md
      - Download:
          - GeoNet 100 Hz interactive notebook: recipes/geonet-100hz-notebook.md
          - GeoNet single-day workflow: recipes/geonet-one-day-workflow.md
          - Station metadata: recipes/download-inventory.md
          - Earthquake catalog: recipes/download-events.md
          - Waveforms: recipes/download-waveforms.md
          - Experimental MassDownloader: recipes/mass-download-waveforms.md
          - Waveform coverage: recipes/waveform-coverage.md
      - Prepare waveforms:
          - MiniSEED to SAC: recipes/convert-miniseed.md
          - Sort and merge SAC: recipes/sort-merge.md
          - Format SAC headers: recipes/format-headers.md
          - Remove response: recipes/remove-response.md
          - Decimate: recipes/decimate.md
      - Events and corrections:
          - Cut event windows: recipes/cut-events.md
          - Correct stations: recipes/correct-stations.md
      - Inversion:
          - MCMC workflow: recipes/mcmc.md
  - API reference:
      - Overview: api/index.md
      - Download: api/download.md
      - Inventory: api/inventory.md
      - Waveforms: api/waveform.md
      - Deconvolution: api/deconvolution.md
      - Decimate: api/decimate.md
      - Events: api/event.md
      - Corrections: api/correct.md
      - MCMC: api/mcmc.md
  - Design and development:
      - Project structure: design/project-structure.md
      - Archive layout: design/archive-layout.md
      - Event cutting: design/event-cutting.md
      - Testing strategy: development/testing.md
      - Roadmap: development/roadmap.md
  - Contributing docs: development.md

plugins:
  - search:
      lang: en
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            heading_level: 4
            show_root_heading: true
            show_root_toc_entry: false
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: public
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Sonder9927/seispy
      name: SeisPy on GitHub
