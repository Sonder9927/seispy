site_name: SeisPy
site_description: Seismic data processing workflows built on ObsPy
site_url: https://sonder9927.github.io/seispy/
site_dir: site
use_directory_urls: false
repo_url: https://github.com/Sonder9927/seispy
repo_name: Sonder9927/seispy
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Sonder Merak

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Start here:
      - Quick start: quickstart.md
      - Choose a workflow: task-guide.md
      - Data archive layout: design/archive-layout.md
  - Recipes:
      - Workflow map: recipes/index.md
      - Guided workflows:
          - Process one GeoNet day: recipes/geonet-one-day-workflow.md
          - Explore GeoNet 100 Hz interactively: recipes/geonet-100hz-notebook.md
      - Acquire data:
          - Download station metadata — download_inventory: recipes/download-inventory.md
          - Download an event catalog — download_earthquake_events: recipes/download-events.md
          - Download known stations — download_waveforms: recipes/download-waveforms.md
          - Discover a region — mass_download_waveforms: recipes/mass-download-waveforms.md
      - Build the archive:
          - Organize SAC files — archive_waveforms: recipes/archive-sac.md
          - Measure network coverage — waveform_coverage: recipes/waveform-coverage.md
      - Process continuous data:
          - Convert MiniSEED to SAC — convert_mseed_to_sac: recipes/convert-miniseed.md
          - Merge SAC by day — merge_waveforms_by_day: recipes/merge-sac.md
          - Remove instrument response — remove_instrument_response: recipes/remove-response.md
          - Decimate waveforms — decimate_waveforms: recipes/decimate.md
      - Prepare events:
          - Cut event windows — cut_event_waveforms: recipes/cut-events.md
          - Format event SAC headers — format_sac_headers: recipes/format-headers.md
      - Correct stations:
          - Correct clock drift — correct_clock_drift: recipes/correct-clock-drift.md
          - Correct orientation — correct_orientation: recipes/correct-orientation.md
      - Run inversion:
          - Prepare and collect MCMC results: recipes/mcmc.md
      - Understand reports and logs: recipes/batch-reports.md
  - Interface reference:
      - Overview: api/index.md
      - Download: api/download.md
      - Inventory: api/inventory.md
      - Waveforms: api/waveform.md
      - Deconvolution: api/deconvolution.md
      - Decimate: api/decimate.md
      - Events: api/event.md
      - Corrections: api/correct.md
      - MCMC: api/mcmc.md
  - Design and development:
      - Project structure: design/project-structure.md
      - Event cutting: design/event-cutting.md
      - Testing strategy: development/testing.md
      - Roadmap: development/roadmap.md
  - Contributing docs: development.md

plugins:
  - search:
      lang: en
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            heading_level: 4
            show_root_heading: true
            show_root_toc_entry: false
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: public
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Sonder9927/seispy
      name: SeisPy on GitHub
