site_name: SeisPy
site_description: Seismic data processing workflows built on ObsPy
site_url: https://sonder9927.github.io/seispy/
site_dir: site
use_directory_urls: false
repo_url: https://github.com/Sonder9927/seispy
repo_name: Sonder9927/seispy
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Sonder Merak

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Find an example: index.md
  - Quick start: quickstart.md
  - Examples:
      - Download:
          - Station metadata: recipes/download-inventory.md
          - Event catalog: recipes/download-events.md
          - Known stations: recipes/download-waveforms.md
          - Regional discovery: recipes/mass-download-waveforms.md
      - Archive and inspect:
          - Organize SAC: recipes/archive-sac.md
          - Filter traces: recipes/filter-waveforms.md
          - Coverage: recipes/waveform-coverage.md
          - Reports and logs: recipes/batch-reports.md
      - Process waveforms:
          - MiniSEED to SAC: recipes/convert-miniseed.md
          - Merge by day: recipes/merge-sac.md
          - Remove response: recipes/remove-response.md
          - Decimate: recipes/decimate.md
      - Events and corrections:
          - Cut events: recipes/cut-events.md
          - SAC headers: recipes/format-headers.md
          - Clock drift: recipes/correct-clock-drift.md
          - Orientation: recipes/correct-orientation.md
      - MCMC: recipes/mcmc.md
      - Complete workflows:
          - GeoNet one day: recipes/geonet-one-day-workflow.md
          - Interactive notebook: recipes/geonet-100hz-notebook.md
  - API reference:
      - Overview: api/index.md
      - Download: api/download.md
      - Inventory: api/inventory.md
      - Waveforms: api/waveform.md
      - Deconvolution: api/deconvolution.md
      - Decimate: api/decimate.md
      - Events: api/event.md
      - Corrections: api/correct.md
      - MCMC: api/mcmc.md
  - Configuration and concepts:
      - Archive layout: design/archive-layout.md
      - MCMC configuration: mcmc/configuration.md
      - MCMC parameterization: mcmc/parameterization.md
  - Development:
      - Project structure: design/project-structure.md
      - Event cutting: design/event-cutting.md
      - Testing: development/testing.md
      - Roadmap: development/roadmap.md
      - Contribute docs: development.md

not_in_nav: |
  /task-guide.md
  /recipes/index.md

plugins:
  - search:
      lang: en
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            heading_level: 4
            show_root_heading: true
            show_root_toc_entry: false
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: public
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Sonder9927/seispy
      name: SeisPy on GitHub
